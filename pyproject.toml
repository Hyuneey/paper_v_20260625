[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperworks"
version = "0.1.0"
description = "Feasibility-first verified rule construction prototype scaffolding."
requires-python = ">=3.11"
dependencies = [
    "jsonschema[format-nongpl]==4.26.0",
]

[project.optional-dependencies]
gdn = [
    "torch==2.12.1",
    "torch-geometric==2.8.0",
]
validation-v2-detector = [
    "numpy==2.5.2",
    "scipy==1.18.1",
    "scikit-learn==1.9.0",
    "joblib==1.5.3",
    "threadpoolctl==3.6.0",
    "narwhals==2.25.0",
]

[tool.setuptools.packages.find]
where = ["src"]
